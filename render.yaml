# Render.com Blueprint 배포 설정
services:
  - type: web
    name: iljeong-yeoljeong
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AUTH_MODE
        value: local
      - key: VITE_AUTH_MODE
        value: local
      - key: LOCAL_ADMIN_NAME
        value: 개인 사용자
      - key: LOCAL_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_MODE
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /app/data/uploads
